const STORAGE_KEY='slovo_ukrainian_study_v1';
const NAV=[['home','⌂','学习首页'],['learn','▣','单词卡片'],['quiz','◇','测验练习'],['dictionary','☷','全部词库'],['mine','☆','我的词汇']];
const TOPIC_ALL={id:'all',cn:'全部主题',uk:'Усі теми',emoji:'📚'};
const $$=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
const todayLocal=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function defaultState(){return {progress:{},favorites:[],custom:[],log:[],quizHistory:[],goal:10};}
function loadState(){try{const obj=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(obj&&typeof obj==='object'){return {...defaultState(),...obj,progress:obj.progress&&typeof obj.progress==='object'?obj.progress:{},favorites:Array.isArray(obj.favorites)?obj.favorites:[],custom:Array.isArray(obj.custom)?obj.custom:[],log:Array.isArray(obj.log)?obj.log:[],quizHistory:Array.isArray(obj.quizHistory)?obj.quizHistory:[]};}}catch(e){}return defaultState();}
let state=loadState();let view='home', selectedTopic='all', dictTopic='all', dictLevel='all', dictQuery='', dictLimit=20, onlyFavorites=false;
let session=null,quiz=null,quizMode='choice';let toastTimer;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){notify('浏览器存储不可用，建议使用“导出数据”保存学习记录。');}}
function notify(message){const el=$$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3300);}
function words(){return [...SEED.words,...state.custom];}
function getWord(id){return words().find(x=>x.id===id);}
function topic(id){return SEED.topics.find(x=>x.id===id)||TOPIC_ALL;}
function vocabByTopic(t){return words().filter(w=>t==='all'||w.topic===t);}
function isFav(id){return state.favorites.includes(id);}
function progressOf(id){return state.progress[id]||null;}
function reviewedToday(){return new Set(state.log.filter(x=>x.day===todayLocal()).map(x=>x.id)).size;}
function dueWords(t='all'){const now=Date.now();return vocabByTopic(t).filter(w=>state.progress[w.id]&&state.progress[w.id].due<=now).sort((a,b)=>state.progress[a.id].due-state.progress[b.id].due);}
function learnedCount(){return words().filter(w=>!!state.progress[w.id]).length;}
function masteredCount(){return words().filter(w=>{const p=state.progress[w.id];return p&&p.reps>=3&&p.interval>=7;}).length;}
function streakDays(){const done=new Set(state.log.map(x=>x.day));const cur=new Date();if(!done.has(todayLocal(cur)))cur.setDate(cur.getDate()-1);let count=0;while(done.has(todayLocal(cur))){count++;cur.setDate(cur.getDate()-1);}return count;}
function updateChrome(){let d=new Date();$$('#topDate').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$$('#streakPill').textContent=`🔥 ${streakDays()} 天`;
 $$('[id=sideMotivate]').textContent=`每日目标 ${state.goal} 个词`;
 const sidebar=$$('#sideNav'),mobile=$$('#bottomNav');sidebar.innerHTML=NAV.map(([id,ico,label])=>`<button type="button" data-action="nav" data-view="${id}" class="nav-btn ${view===id?'active':''}"><span style="font-size:20px;width:22px;text-align:center">${ico}</span><span>${label}</span></button>`).join('');mobile.innerHTML=NAV.map(([id,ico,label])=>`<button type="button" data-action="nav" data-view="${id}" class="bottom-link ${view===id?'active':''}"><span class="bicon">${ico}</span><span>${label.replace('学习首页','首页').replace('单词卡片','背单词').replace('测验练习','测验').replace('全部词库','词库').replace('我的词汇','我的')}</span></button>`).join('');}
function route(to){view=to;if(to==='learn'&&!session)makeSession(selectedTopic);if(to==='quiz'&&quiz&&quiz.ended)quiz=null;render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){updateChrome();const el=$$('#page');if(view==='home')el.innerHTML=renderHome();else if(view==='learn')el.innerHTML=renderLearn();else if(view==='quiz')el.innerHTML=renderQuiz();else if(view==='dictionary')el.innerHTML=renderDict();else if(view==='mine')el.innerHTML=renderMine();}
function renderHome(){let total=words().length,due=dueWords().length,today=reviewedToday(),goal=state.goal,pct=Math.min(100,Math.round(today/goal*100));return `
<section class="hero"><div class="hero-body"><div class="hero-overline">ТВОЯ УКРАЇНСЬКА · 每天进步一点</div><h2>每天 15 分钟，<br/>更自然地说乌克兰语。</h2><p>从基辅日常生活、大学办事，到能源展会交流。<br/>用真实场景记住每一个词。</p><button class="btn btn-orange" data-action="start-learn" data-topic="all">开始今日学习 <span aria-hidden="true">↗</span></button></div><div class="hero-side"><div class="hero-stat">${total}</div><div class="hero-minor">精选双语词汇</div><div class="hero-minor" style="margin-top:14px">А2 → B1 · ${SEED.topics.length} 个主题</div></div></section>
<div class="kpis"><div class="kpi"><div class="kpi-top"><span>今日已学</span><span class="kpi-icon">✦</span></div><div class="kpi-value">${today}<span style="font-size:15px;color:#8ca49b"> / ${goal}</span></div><div class="kpi-note">今日不同词汇数</div></div><div class="kpi"><div class="kpi-top"><span>待复习</span><span class="kpi-icon">↻</span></div><div class="kpi-value">${due}</div><div class="kpi-note">根据记忆计划安排</div></div><div class="kpi"><div class="kpi-top"><span>已经接触</span><span class="kpi-icon">✓</span></div><div class="kpi-value">${learnedCount()}</div><div class="kpi-note">其中熟练掌握 ${masteredCount()} 词</div></div></div>
<div class="section-head"><div><h3>选择你想学的主题</h3><p>以实用场景分类，点击进入专属单词卡</p></div><button class="btn btn-ghost btn-sm" data-action="nav" data-view="dictionary">查看全部 ${total} 词 ↗</button></div>

function makeSession(t='all',preferredIds){selectedTopic=t;let arr=vocabByTopic(t);let ids;if(preferredIds&&preferredIds.length){ids=preferredIds.filter(id=>getWord(id));}else{let due=dueWords(t),novel=shuffle(arr.filter(w=>!state.progress[w.id])),other=shuffle(arr.filter(w=>!!state.progress[w.id]&&state.progress[w.id].due>Date.now()));ids=[...due,...novel,...other].slice(0,Math.max(12,Math.min(25,state.goal))).map(w=>w.id);}session={ids,index:0,flipped:false,started:Date.now(),rated:0};}
function renderLearn(){if(!session)makeSession(selectedTopic);const s=session;if(!s.ids.length)return `<div class="empty-state"><div class="emoji">📚</div><h3>还没有单词</h3><p>请切换主题或到“我的词汇”添加自定义单词。</p></div>`;
 if(s.index>=s.ids.length)return `<div class="content-heading"><div><h1>本轮学习完成 🎉</h1><p>Добре зроблено! 做得好！</p></div></div><div class="card center" style="max-width:650px;margin:auto;padding:55px 25px"><div style="font-size:56px">🌿</div><h2 style="font-size:29px">你刚刚复习了 ${s.ids.length} 张词卡</h2><p class="muted">其中标记记忆程度 ${s.rated} 次；系统已自动安排下次复习时间。</p><div class="tools" style="justify-content:center;margin-top:25px"><button class="btn btn-primary" data-action="start-learn" data-topic="${selectedTopic}">再学一组</button><button class="btn btn-light" data-action="nav" data-view="home">返回首页</button></div></div>`;
 const w=getWord(s.ids[s.index]);if(!w){s.index++;return renderLearn();}const count=s.index+1;const p=Math.round(s.index/s.ids.length*100);return `<div class="learn-layout"><div class="content-heading"><div><div class="eyebrow">FLASHCARDS · 智能词卡</div><h1>单词记忆</h1><p>${esc(topic(selectedTopic).cn)} · 正面回忆，背面核对</p></div><button class="btn btn-border btn-sm" data-action="nav" data-view="home">返回首页</button></div>
<div class="learn-progress"><div class="progress-line"><div class="progress-fill" style="width:${p}%"></div></div><strong class="small" style="white-space:nowrap">${count} / ${s.ids.length}</strong></div>
<div class="flip-card ${s.flipped?'back':''}" role="button" tabindex="0" aria-label="翻转单词卡" data-action="flip"><div class="card-badges"><span class="level-badge ${w.level==='B1'?'b1':''}">${esc(w.level)}</span><span class="level-badge">${esc(topic(w.topic).cn)}</span></div><div class="flip-card-inner">${!s.flipped?`<div class="language-tag">УКРАЇНСЬКОЮ · 乌克兰语</div><div class="uk-word" lang="uk">${esc(w.uk)}</div><div class="tap-hint">轻触卡片查看中文释义 ↻</div>`:`<div class="language-tag">ЗНАЧЕННЯ · 中文意思</div><div class="uk-word" style="font-size:clamp(26px,4vw,42px)" lang="uk">${esc(w.uk)}</div><div class="zh-word">${esc(w.zh)}</div>${w.ex?`<div class="example-uk" lang="uk">${esc(w.ex)}</div><div class="example-zh">${esc(w.exZh||'')}</div>`:''}<div class="tap-hint">点击卡片返回正面 ↻</div>`}</div></div>
<div class="flash-actions"><div class="flash-actions-left"><button class="btn btn-border btn-sm" data-action="speak" data-id="${esc(w.id)}" aria-label="朗读乌克兰语">🔊 听发音</button><button class="btn btn-border btn-sm" data-action="flip">↻ 翻面</button></div><div class="flash-actions-right"><button class="round-btn ${isFav(w.id)?'active':''}" data-action="fav" data-id="${esc(w.id)}" title="收藏单词" aria-label="收藏单词">${isFav(w.id)?'★':'☆'}</button><button class="btn btn-border btn-sm" data-action="prev-learn" ${s.index===0?'disabled':''}>← 上一张</button><button class="btn btn-border btn-sm" data-action="skip-learn">下一张 →</button></div></div>
<div class="center"><div style="font-weight:800;margin:11px 0">${s.flipped?'这个词记得怎么样？':'先回忆含义，再翻面评价记忆程度'}</div><div class="rating-area"><button class="rating again" data-action="grade" data-grade="again">忘记了</button><button class="rating hard" data-action="grade" data-grade="hard">有点难</button><button class="rating good" data-action="grade" data-grade="good">记住了</button><button class="rating easy" data-action="grade" data-grade="easy">很熟练</button></div><div class="quiet-info">按记忆程度安排下次复习 · 本机自动保存</div></div></div>`;}
function markGrade(id,grade){const now=Date.now(),old=state.progress[id]||{interval:0,ease:2.5,reps:0};let interval=old.interval||0,ease=old.ease||2.5,reps=old.reps||0;
 if(grade==='again'){interval=10/(60*24);ease=Math.max(1.3,ease-.2);reps=0;}else if(grade==='hard'){interval=interval<1?1:Math.max(1,interval*1.2);ease=Math.max(1.3,ease-.14);reps+=1;}else if(grade==='good'){interval=interval<1?1:Math.max(2,interval*ease);reps+=1;}else{interval=interval<1?4:Math.max(4,interval*ease*1.35);ease=Math.min(3,ease+.08);reps+=1;}
 state.progress[id]={interval,ease,reps,due:now+interval*86400000,last:now,grade};state.log.push({day:todayLocal(),id,grade,ts:now});if(state.log.length>20000)state.log=state.log.slice(-12000);save();}
function buildQuiz(){let pool=vocabByTopic(selectedTopic),items=shuffle(pool).slice(0,Math.min(10,pool.length));if(!items.length){notify('当前主题还没有词汇');return;}quiz={mode:quizMode,ids:items.map(x=>x.id),index:0,correct:0,answers:[],feedback:null,options:[],ended:false};prepareQuizQuestion();route('quiz');}

function normalizeUK(s){return String(s||'').toLocaleLowerCase('uk-UA').trim().replace(/[’ʼ`´]/g,"'").replace(/\s+/g,' ');}

 if(quiz.ended){const pct=Math.round(quiz.correct/quiz.ids.length*100),missed=quiz.answers.filter(a=>!a.correct).map(a=>a.id);return `<div class="content-heading"><div><h1>测验完成 🎉</h1><p>Вітаємо! 继续保持。</p></div></div><div class="card" style="max-width:650px;margin:auto"><div class="result-score"><div class="eyebrow">YOUR RESULT</div><div class="number">${pct}<span style="font-size:33px">%</span></div><p>答对 ${quiz.correct} / ${quiz.ids.length} 题</p></div><div class="divider"></div><div class="tools" style="justify-content:center"><button class="btn btn-primary" data-action="again-quiz">再做一轮</button>${missed.length?`<button class="btn btn-border" data-action="review-missed">复习 ${missed.length} 个错词</button>`:''}<button class="btn btn-light" data-action="nav" data-view="home">返回首页</button></div></div>`;}
 const w=getWord(quiz.ids[quiz.index]),f=quiz.feedback;return `<div class="quiz-panel"><div class="content-heading"><div><div class="eyebrow">QUIZ · 知识测验</div><h1>${quiz.mode==='choice'?'词义选择':'拼写挑战'}</h1><p>${esc(topic(selectedTopic).cn)} · ${quiz.mode==='choice'?'选择正确的中文含义':'使用乌克兰语输入法作答'}</p></div><button class="btn btn-border btn-sm" data-action="exit-quiz">退出</button></div><div class="quiz-top"><span>问题 ${quiz.index+1} / ${quiz.ids.length}</span><span>已答对 ${quiz.correct} 题</span></div><div class="progress-line" style="margin:12px 0 20px"><div class="progress-fill" style="width:${Math.round(quiz.index/quiz.ids.length*100)}%"></div></div><div class="card"><div class="quiz-question"><div class="prompt">${quiz.mode==='choice'?'这个词是什么意思？':'请写出对应的乌克兰语'}</div><h2 lang="${quiz.mode==='choice'?'uk':'zh'}">${esc(quiz.mode==='choice'?w.uk:w.zh)}</h2>${quiz.mode==='choice'?`<button class="btn btn-light btn-sm" data-action="speak" data-id="${esc(w.id)}">🔊 朗读</button>`:''}</div>${quiz.mode==='choice'?`<div class="choices">${quiz.options.map((o,i)=>`<button class="choice ${f?(o.id===w.id?'correct':(f.answer===o.id?'wrong':'')):''}" data-action="answer-choice" data-id="${esc(o.id)}" ${f?'disabled':''}><span style="font-size:12px;color:#96aa9e;margin-right:10px">${'ABCD'[i]}</span>${esc(o.zh)}</button>`).join('')}</div>`:`<div><input id="spellAnswer" class="answer-input" type="text" lang="uk" autocomplete="off" spellcheck="false" placeholder="在这里输入乌克兰语…" ${f?'disabled':''} aria-label="乌克兰语拼写答案"/><div style="margin-top:13px">${!f?'<button class="btn btn-primary" data-action="check-spelling">检查答案</button>':''}</div></div>`}${f?`<div class="feedback ${f.correct?'good':'bad'}"><strong>${f.correct?'✓ 回答正确！':'↻ 继续加油'}</strong><br/>正确答案：<span lang="uk"><b>${esc(w.uk)}</b></span> — ${esc(w.zh)}${w.ex?`<div style="margin-top:7px"><span lang="uk">${esc(w.ex)}</span><br/>${esc(w.exZh)}</div>`:''}</div><div style="text-align:right;margin-top:17px"><button class="btn btn-primary" data-action function renderMine(){const fav=words().filter(w=>isFav(w.id)),own=state.custom;return `<div class="content-heading"><div><div class="eyebrow">MY SPACE · 个性化词汇</div><h1>我的词汇工作台</h1><p>收藏常用词、添加新词，并备份你的记忆进度。</p></div></div><div class="split"><div><div class="card"><div class="section-head" style="margin-top:0"><div><h3>添加自己的单词</h3><p>专业术语、日常新词都能放进你的专属词库</p></div></div><form id="newWordForm"><div class="form-grid"><div><label class="input-label" for="newUK">乌克兰语 *</label><input class="text-input" id="newUK" maxlength="90" required lang="uk" placeholder="例如：обладнання"/></div><div><label class="input-label" for="newZH">中文释义 *</label><input class="text-input" id="newZH" maxlength="100" required placeholder="例如：设备"/></div><div class="field-wide"><label class="input-label" for="newEx">乌克兰语例句（可选）</label><input class="text-input" id="newEx" maxlength="240" lang="uk" placeholder="例如：Це сучасне обладнання."/></div><div class="field-wide"><label class="input-label" for="newExZh">例句翻译（可选）</label><input class="text-input" id="newExZh" maxlength="240" placeholder="例如：这是现代化设备。"/></div><div><label class="input-label" for="newTopic">主题</label><select id="newTopic" class="select" style="width:100%">${SEED.topics.map(t=>`<option value="${t.id}">${esc(t.cn)}</option>`).join('')}</select></div><div><label class="input-label" for="newLevel">等级</label><select id="newLevel" class="select" style="width:100%"><option value="A2">A2</option><option value="B1">B1</option></select></div></div><button class="btn btn-primary" type="submit" style="margin-top:19px;width:100%">＋ 添加到我的词库</button></form></div><div class="card" style="margin-top:17px"><h3 style="margin:0 0 12px">数据与备份</h3><p class="muted small">进度默认保存在当前浏览器中。换设备或清除浏览器数据前，请导出备份。</p><div class="tools"><button class="btn btn-border btn-sm" data-action="export">↓ 导出 JSON</button><button class="btn btn-border btn-sm" data-action="import">↑ 导入备份</button></div></div></div><div><div class="card"><div class="section-head" style="margin-top:0"><di function speak(id){const w=getWord(id);if(!w)return;if(!('speechSynthesis' in window)){notify('当前浏览器不支持语音朗读。');return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.uk);u.lang='uk-UA';u.rate=.84;u.pitch=1;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==='uk-ua')||voices.find(v=>v.lang.toLowerCase().startsWith('uk'));if(voice)u.voice=voice;speechSynthesis.speak(u);if(!voice)notify('正在尝试乌语朗读；若读音不对，请在设备中安装乌克兰语语音。');}catch(e){notify('朗读不可用，请检查设备的乌克兰语语音设置。');}}
function exportData(){let data={app:'SLOVO',version:1,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`slovo-backup-${todayLocal()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('学习数据已导出为 JSON 文件');}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='SLOVO'||!obj.state||!Array.isArray(obj.state.custom)||typeof obj.state.progress!=='object')throw Error('file format');if(!confirm('导入将覆盖当前浏览器内的学习记录和自建单词，确认继续吗？'))return;const src=obj.state;state={progress:src.progress||{},favorites:Array.isArray(src.favorites)?src.favorites:[],custom:src.custom.filter(w=>w&&typeof w.uk==='string'&&typeof w.zh==='string'&&typeof w.id==='string'&&SEED.topics.some(t=>t.id===w.topic)).slice(0,2000).map(w=>({...w,uk:w.uk.slice(0,90),zh:w.zh.slice(0,100),ex:String(w.ex||'').slice(0,240),exZh:String(w.exZh||'').slice(0,240),level:w.level==='B1'?'B1':'A2'})),log:Array.isArray(src.log)?src.log.slice(-20000):[],quizHistory:Array.isArray(src.quizHistory)?src.quizHistory.slice(-200):[],goal:Math.max(5,Math.min(100,Number(src.goal)||15))};save();session=null;quiz=null;route('home');notify('备份导入成功！');}catch(e){notify('导入失败：不是有效的 СЛОВО 备份文件。');}};reader.readAsText(file);}
function addNewWord(e){e.preventDefault();const uk=$$('#newUK').value.trim(),zh=$$('#newZH').value.trim();if(!uk||!zh)return;if(words().some(w=>w.uk.toLocaleLowerCase()===uk.toLocaleLowerCase())){notify('这个乌克兰语词汇已经存在，可直接搜索并收藏。');return;}const w={id:'own-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),uk:uk.slice(0,90),zh:zh.slice(0,100),ex:$$('#newEx').value.trim().slice(0,240),exZh:$$('#newExZh').value.trim().slice(0,240),topic:$$('#newTopic').value,level:$$('#newLevel').value};state.custom.unshift(w);save();render();notify(`已添加 ${uk}，现在可以在词卡和测验中复习。`);}
function toggleFav(id){if(!getWord(id))return;if(isFav(id))state.favorites=state.favorites.filter(x=>x!==id);else state.favorites.push(id);save();render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;switch(a){case'nav':route(el.dataset.view);break;case'start-learn':makeSession(el.dataset.topic||'all');route('learn');break;case'flip':if(session){session.flipped=!session.flipped;render();}break;case'prev-learn':if(session&&session.index>0){session.index--;session.flipped=false;render();}break;case'skip-learn':if(session){session.index++;session.flipped=false;render();}break;case'grade':if(session&&session.index<session.ids.length){markGrade(session.ids[session.index],el.dataset.grade);session.rated++;session.index++;session.flipped=false;render();}break;case'speak':speak(id);break;case'fav':toggleFav(id);break;case'goal':state.goal=Math.max(5,Math.min(100,state.goal+Number(el.dataset.delta)));save();render();break;case'set-quiz-mode':quizMode=el.dataset.mode;render();break;case'start-quiz':buildQuiz();break;case'answer-choice':gradeQuiz(id);break;case'check-spelling':gradeQuiz($$('#spellAnswer')?.value||'');break;case'quiz-next':nextQuiz();break;case'again-quiz':quiz=null;buildQuiz();break;case'exit-quiz':quiz=null;render();break;case'review-missed':{let ids=quiz.answers.filter(x=>!x.correct).map(x=>x.id);makeSession(selectedTopic,ids);quiz=null;route('learn');break;}case'load-more':dictLimit+=20;render();break;case'toggle-only-fav':onlyFavorites=!onlyFavorites;dictLimit=20;render();break;case'see-fav':onlyFavorites=true;dictTopic='all';dictQuery='';dictLimit=20;route('dictionary');break;case'export':exportData();break;case'import':$$('#importFile').click();break;case'delete-own':if(confirm('确认删除这个自建单词吗？')){state.custom=state.custom.filter(w=>w.id!==id);state.favorites=state.favorites.filter(x=>x!==id);delete state.progress[id];save();render();notify('已删除自建词汇。');}break;}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='quizTopic')selectedTopic=t.value;if(t.id==='dictTopic'){dictTopic=t.value;dictLimit=20;render();}if(t.id==='dictLevel'){dictLevel=t.value;dictLimit=20;render();}if(t.id==='importFile'){importData(t.files?.[0]);t.value='';}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='dictSearch'){dictQuery=t.value;dictLimit=20;const el=$$('#page');let start=t.selectionStart;render();const n=$$('#dictSearch');n?.focus();try{n?.setSelectionRange(start,start);}catch(e){}}if(t.id==='globalSearch'&&t.value.trim()){dictQuery=t.value;dictTopic='all';dictLevel='all';onlyFavorites=false;dictLimit=20;view='dictionary';render();}});
document.addEventListener('submit',e=>{if(e.target.id==='newWordForm')addNewWord(e);});
document.addEventListener('keydown',e=>{const inInput=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if(e.key==='Enter'&&document.activeElement?.id==='spellAnswer'){e.preventDefault();gradeQuiz($$('#spellAnswer').value);return;}if(inInput)return;if(view==='learn'&&session&&session.index<session.ids.length){if(e.code==='Space'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();session.flipped=!session.flipped;render();}}});
render();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./service-worker.js").catch(() => {});
}
</script>
